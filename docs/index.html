<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#030c1a;
  --brass:#c9a86a;
  --brass2:rgba(201,168,106,0.15);
  --off:#c8d8f0;
  --muted:rgba(200,216,240,0.5);
  --glass:rgba(6,20,46,0.82);
  --edge:rgba(201,168,106,0.08);
  --font:'Inter',system-ui,sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:#fff}
canvas{position:fixed;inset:0;z-index:0;display:block}

/* ── NAV ── */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:300;
  display:flex;align-items:center;justify-content:space-between;
  padding:.9rem 2rem;
  background:rgba(3,12,26,.7);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--edge);
}
.logo{font-size:1rem;font-weight:700;color:var(--brass);text-decoration:none;letter-spacing:.08em}
.nav-hint{font-size:.7rem;color:var(--muted);letter-spacing:.06em;display:flex;align-items:center;gap:.5rem}
.nav-hint span{opacity:.5}
.nav-cv{color:var(--brass);text-decoration:none;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(201,168,106,.4);padding:.3rem .9rem;border-radius:2rem;transition:all .2s}
.nav-cv:hover{background:var(--brass);color:var(--bg)}

/* ── LABEL LAYER (3D node labels) ── */
#labels{position:fixed;inset:0;z-index:10;pointer-events:none}
.lbl{
  position:absolute;transform:translate(-50%,-50%);
  pointer-events:auto;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:opacity .25s;
}
.lbl .lt{
  font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--off);opacity:.6;white-space:nowrap;
  transition:color .2s,opacity .2s,transform .2s;
}
.lbl .ls{
  font-size:.55rem;color:var(--muted);letter-spacing:.06em;
  opacity:0;transition:opacity .2s;white-space:nowrap;
}
.lbl.center .lt{font-size:.85rem;font-weight:700;color:var(--brass);opacity:1;letter-spacing:.04em}
.lbl.center .ls{opacity:.6;font-size:.6rem;color:var(--muted)}
.lbl:hover .lt,.lbl.active .lt{color:var(--brass);opacity:1;transform:translateY(-2px)}
.lbl:hover .ls,.lbl.active .ls{opacity:.8}
.lbl.sub .lt{font-size:.52rem;letter-spacing:.08em;opacity:.5}
.lbl.sub:hover .lt,.lbl.sub.active .lt{opacity:1;color:var(--brass)}

/* ── CONTENT PANEL ── */
#panel{
  position:fixed;top:0;right:0;bottom:0;z-index:200;
  width:min(500px,100vw);
  background:var(--glass);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border-left:1px solid rgba(201,168,106,.18);
  transform:translateX(100%);
  transition:transform .45s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
  padding:5rem 2rem 3rem;
  scrollbar-width:thin;
  scrollbar-color:rgba(201,168,106,.2) transparent;
}
#panel.open{transform:translateX(0)}
#panel-close{
  position:absolute;top:1.1rem;right:1.5rem;
  background:none;border:none;cursor:pointer;
  color:var(--off);font-size:1.1rem;opacity:.6;
  transition:opacity .2s;padding:.3rem .6rem;
  font-family:var(--font);
}
#panel-close:hover{opacity:1}
.p-tag{font-size:.62rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--brass);margin-bottom:.7rem;display:block}
.p-title{font-size:1.6rem;font-weight:700;line-height:1.15;margin-bottom:1rem;letter-spacing:-.02em}
.p-lead{font-size:.9rem;color:var(--off);line-height:1.65;margin-bottom:1.75rem}
.p-sec{margin-bottom:1.5rem}
.p-sec h3{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:1px solid rgba(201,168,106,.15)}
.p-item{display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.7rem}
.p-dot{width:4px;height:4px;border-radius:50%;background:var(--brass);flex-shrink:0;margin-top:.45rem}
.p-txt{font-size:.8rem;color:var(--off);line-height:1.6}
.p-txt strong{color:#fff;font-weight:600}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-bottom:1.5rem}
.stat-box{background:rgba(201,168,106,.07);border:1px solid rgba(201,168,106,.15);border-radius:.5rem;padding:.8rem 1rem}
.stat-num{display:block;font-size:1.5rem;font-weight:700;color:var(--brass);line-height:1}
.stat-lbl{display:block;font-size:.65rem;color:var(--muted);margin-top:.3rem;letter-spacing:.03em}
.role-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:.5rem;padding:.9rem 1rem;margin-bottom:.75rem}
.role-title{font-size:.8rem;font-weight:600;color:#fff;margin-bottom:.2rem}
.role-meta{font-size:.65rem;color:var(--muted);margin-bottom:.5rem}
.role-body{font-size:.75rem;color:var(--off);line-height:1.55}
.skill-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.chip{font-size:.65rem;font-weight:600;letter-spacing:.06em;padding:.25rem .65rem;border-radius:1rem;border:1px solid rgba(201,168,106,.3);color:var(--off);background:rgba(201,168,106,.06)}
.cta-row{display:flex;gap:.6rem;margin-top:1.5rem;flex-wrap:wrap}
.btn{padding:.55rem 1.2rem;border-radius:2rem;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-decoration:none;transition:all .2s;display:inline-flex;align-items:center;gap:.35rem;border:none;cursor:pointer;font-family:var(--font)}
.bp{background:var(--brass);color:var(--bg)}
.bp:hover{background:#fff;box-shadow:0 4px 20px rgba(201,168,106,.3)}
.bo{background:transparent;color:var(--off);border:1px solid rgba(255,255,255,.2)}
.bo:hover{border-color:var(--brass);color:var(--brass)}

/* ── HINT OVERLAY ── */
#hint{
  position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);
  z-index:100;
  font-size:.7rem;letter-spacing:.1em;color:var(--muted);text-align:center;
  pointer-events:none;
  animation:fadeHint 1s ease 2s both, fadeOut 1s ease 7s forwards;
}
@keyframes fadeHint{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fadeOut{to{opacity:0}}

/* ── MOBILE ── */
@media(max-width:600px){
  #panel{width:100vw}
  .nav-hint{display:none}
  .p-title{font-size:1.3rem}
}
</style>

/* ═══════════════════════════════════════
   NODE DEFINITIONS
════════════════════════════════════════ */
var W = window.innerWidth, H = window.innerHeight;
var isMobile = W < 700;

/* 3D positions for main nodes — arranged so they look good in 3D when rotated */
var NODES = [
  { id:'center', label:'Ali Alzahrani', sub:'Middle East IT Leader', size:0.14, color:0xc9a86a, emissive:0xc9a86a, emissiveIntensity:0.6, pos:[0,0,0], isCenter:true },
  { id:'career',   label:'CAREER',   sub:'12 yrs · 2 employers',  size:0.09, color:0x4a9eff, emissive:0x2060c0, emissiveIntensity:0.5, pos:[ 2.0, 0.6,-0.4], parent:'center' },
  { id:'ai',       label:'AI',       sub:'~300 trained · ISO 42001', size:0.09, color:0xf0c060, emissive:0xd09020, emissiveIntensity:0.5, pos:[-1.4, 1.2, 1.1], parent:'center' },

/* edges: pairs of node ids to draw lines between */
var EDGES = [
  ['center','career'],['center','ai'],['center','skills'],
  ['center','projects'],['center','impact'],['center','connect'],

var nodeMap = {};
ALL_NODES.forEach(function(n){ nodeMap[n.id] = n; });

/* create node meshes */
var meshes = []; /* array of {mesh, node} */
var labelEls = {}; /* id -> DOM element */
var labelsDiv = document.getElementById('labels');

ALL_NODES.forEach(function(n){
  var geo = new THREE.SphereGeometry(n.size, 16, 12);
  var mat = new THREE.MeshBasicMaterial({color:n.color, transparent:true, opacity:0.95});
  var mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(n.pos[0], n.pos[1], n.pos[2]);
  mesh.userData.nodeId = n.id;
  scene.add(mesh);
  meshes.push({mesh:mesh, node:n});
  n._mesh = mesh;

  /* store ref for highlight control */
  n._glow = mesh.material;

  /* CSS label */
  var el = document.createElement('div');
  el.className = 'lbl' + (n.isCenter ? ' center' : '') + (n.size < 0.055 ? ' sub' : '');
  el.dataset.id = n.id;
  el.innerHTML = '<span class="lt">'+n.label+'</span>' + (n.sub ? '<span class="ls">'+n.sub+'</span>' : '');
  if(!n.size < 0.04) el.style.pointerEvents = 'auto';
  labelsDiv.appendChild(el);
  labelEls[n.id] = el;

  if(CONTENT[n.id]){
    el.addEventListener('click', function(){ openPanel(n.id); });

  var geo = new THREE.BufferGeometry().setFromPoints(pts);
  var isCross = !['center'].includes(e[0]) && !['center'].includes(e[1]) && !e[1].match(/vallourec|target|awards|copilot|rfq|iso42001|infra|security|aramco|network|covid|stat12|stat300|linkedin|edu/);

  var color = a.isCenter ? (nodeMap[b.id] || {color:0x3a60a8}).color : a.color;
  var mat = new THREE.LineBasicMaterial({color:color, transparent:true, opacity:opacity});
  var line = new THREE.Line(geo, mat);
  scene.add(line);
  edgeMeshes.push({line:line, a:a, b:b, mat:mat, baseOpacity:opacity});
  a._edges = a._edges || []; a._edges.push({mat:mat,baseOpacity:opacity});
  b._edges = b._edges || []; b._edges.push({mat:mat,baseOpacity:opacity});
});

/* particle background */
var ptCount = isMobile ? 300 : 600;
var ptPos = new Float32Array(ptCount*3);
for(var i=0;i<ptCount;i++){
  var r = 5+Math.random()*10;
  var t = Math.random()*Math.PI*2, p = Math.random()*Math.PI;
  ptPos[i*3]  =r*Math.sin(p)*Math.cos(t);
  ptPos[i*3+1]=r*Math.sin(p)*Math.sin(t);
  ptPos[i*3+2]=r*Math.cos(p);
}
var ptGeo = new THREE.BufferGeometry(); ptGeo.setAttribute('position',new THREE.BufferAttribute(ptPos,3));
scene.add(new THREE.Points(ptGeo, new THREE.PointsMaterial({size:.022,color:0x2a4880,transparent:true,opacity:.5})));

/* ═══════════════════════════════════════
   MOUSE / DRAG / HOVER
════════════════════════════════════════ */
var mouse = new THREE.Vector2(-999,-999);
var isDragging = false, dragStart = {x:0,y:0};
var rotY = 0.0, rotX = 0.06; /* initial rotation */
var targetRotY = rotY, targetRotX = rotX;
var autoRotY = 0;
var hovered = null;
var raycaster = new THREE.Raycaster();
raycaster.params.Points = {threshold:0.05};

function getClient(e){ return e.touches ? e.touches[0] : e; }

canvas.addEventListener('mousedown', function(e){
  isDragging=true; dragStart.x=e.clientX; dragStart.y=e.clientY;
  canvas.style.cursor='grabbing';
});
canvas.addEventListener('touchstart', function(e){
  isDragging=true; var t=e.touches[0]; dragStart.x=t.clientX; dragStart.y=t.clientY;
},{passive:true});

window.addEventListener('mousemove', function(e){
  if(isDragging){
    targetRotY += (e.clientX-dragStart.x)*0.006;
    targetRotX += (e.clientY-dragStart.y)*0.004;
    targetRotX = Math.max(-0.7, Math.min(0.7, targetRotX));
    dragStart.x=e.clientX; dragStart.y=e.clientY;
  }
  mouse.x=(e.clientX/W)*2-1;
  mouse.y=-(e.clientY/H)*2+1;
});
window.addEventListener('touchmove', function(e){
  if(isDragging){
    var t=e.touches[0];
    targetRotY += (t.clientX-dragStart.x)*0.008;
    targetRotX += (t.clientY-dragStart.y)*0.005;
    targetRotX = Math.max(-0.7, Math.min(0.7, targetRotX));
    dragStart.x=t.clientX; dragStart.y=t.clientY;
  }
},{passive:true});

window.addEventListener('mouseup', function(){ isDragging=false; canvas.style.cursor=''; });
window.addEventListener('touchend', function(){ isDragging=false; });

/* click on canvas: pick node via raycaster */
canvas.addEventListener('click', function(e){
  if(Math.abs(e.clientX-dragStart.x)>5||Math.abs(e.clientY-dragStart.y)>5) return;
  var rect=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/W)*2-1;
  mouse.y=-((e.clientY-rect.top)/H)*2+1;
  raycaster.setFromCamera(mouse, camera);
  var intersects = raycaster.intersectObjects(meshes.map(function(m){return m.mesh;}));
  if(intersects.length){
    var id = intersects[0].object.userData.nodeId;
    if(CONTENT[id]) openPanel(id);
    else {
      /* find parent's content */
      var n = nodeMap[id];
      if(n && n.parent && CONTENT[n.parent]) openPanel(n.parent);
    }
  }
});

/* ═══════════════════════════════════════
   PANEL
════════════════════════════════════════ */
var panelEl = document.getElementById('panel');
var panelBody = document.getElementById('panel-body');
var currentOpen = null;

document.getElementById('panel-close').addEventListener('click', closePanel);
panelEl.addEventListener('click', function(e){ e.stopPropagation(); });

function openPanel(id){
  var d = CONTENT[id];
  if(!d) return;
  currentOpen = id;

  /* highlight node */
  ALL_NODES.forEach(function(n){
    var active = (n.id===id || n.parent===id);
    if(n._mesh){
      n._mesh.material.opacity = active ? 1.0 : 0.25;
    }
    var el = labelEls[n.id];
    if(el) el.classList.toggle('active', active);
  });
  edgeMeshes.forEach(function(e){
    var active = (e.a.id===id||e.b.id===id||e.a.parent===id||e.b.parent===id);
    e.mat.opacity = active ? e.baseOpacity*2.5 : e.baseOpacity*0.3;
  });

  /* build HTML */
  var html = '';
  html += '<span class="p-tag">'+d.tag+'</span>';
  html += '<h2 class="p-title">'+d.title+'</h2>';
  html += '<p class="p-lead">'+d.lead+'</p>';

  if(d.stats){
    html += '<div class="stat-row">';
    d.stats.forEach(function(s){
      html += '<div class="stat-box"><span class="stat-num">'+s.n+'</span><span class="stat-lbl">'+s.l+'</span></div>';
    });
    html += '</div>';
  }

  if(d.chips){
    html += '<div class="p-sec"><h3>Technologies & Capabilities</h3><div class="skill-chips">';
    d.chips.forEach(function(c){ html += '<span class="chip">'+c+'</span>'; });
    html += '</div></div>';
  }

  if(d.sections){
    d.sections.forEach(function(s){
      html += '<div class="p-sec"><h3>'+s.h+'</h3>';
      s.items.forEach(function(item){
        html += '<div class="p-item"><div class="p-dot"></div><div class="p-txt">'+item+'</div></div>';
      });
      html += '</div>';
    });
  }

  if(d.ctas){
    html += '<div class="cta-row"><a class="btn bp" href="Ali-Alzahrani-CV.pdf" download>Download CV</a><a class="btn bo" href="https://www.linkedin.com/in/ali-alzahrani-one/" target="_blank" rel="noopener">LinkedIn</a></div>';
  }

  panelBody.innerHTML = html;
  panelEl.classList.add('open');
  panelEl.scrollTop = 0;
}

function closePanel(){
  panelEl.classList.remove('open');
  currentOpen = null;
  /* restore all nodes */
  ALL_NODES.forEach(function(n){
    if(n._mesh) n._mesh.material.opacity = 0.95;
    var el = labelEls[n.id]; if(el) el.classList.remove('active');
  });
  edgeMeshes.forEach(function(e){ e.mat.opacity = e.baseOpacity; });
}

/* close on background click */
canvas.addEventListener('click', function(e){
  if(!isDragging && !e.target.closest && currentOpen){
    var rect=canvas.getBoundingClientRect();
    mouse.x=((e.clientX-rect.left)/W)*2-1;
    mouse.y=-((e.clientY-rect.top)/H)*2+1;
    raycaster.setFromCamera(mouse, camera);
    var hits=raycaster.intersectObjects(meshes.map(function(m){return m.mesh;}));
    if(!hits.length) closePanel();
  }
});

/* ═══════════════════════════════════════
   ANIMATE
════════════════════════════════════════ */
var t = 0;
var pivot = new THREE.Group();
scene.add(pivot);
/* move all nodes and edges into pivot */
meshes.forEach(function(m){ pivot.add(m.mesh); });
edgeMeshes.forEach(function(e){ pivot.add(e.line); });

var projVec = new THREE.Vector3();

function updateLabels(){
  ALL_NODES.forEach(function(n){
    var el = labelEls[n.id]; if(!el) return;
    /* project 3D position to screen */
    projVec.set(n.pos[0], n.pos[1], n.pos[2]);
    projVec.applyMatrix4(pivot.matrixWorld);
    projVec.project(camera);
    var sx = (projVec.x+1)*0.5*W;
    var sy = (1-projVec.y)*0.5*H;
    var behindCamera = projVec.z > 1;
    el.style.left = sx+'px';
    el.style.top = sy+'px';
    el.style.opacity = behindCamera ? '0' : '1';
    /* hide tiny sub-node labels when far away */
    if(n.size < 0.045 && !n.isCenter){
      el.style.display = projVec.z < 1 ? 'flex' : 'none';
    }
  });
}

function animate(){
  requestAnimationFrame(animate);
  t += 0.001;

  /* auto rotation when not dragging */
  if(!isDragging) autoRotY += 0.0007;

  /* smooth lerp to target rotation */
  rotY += (targetRotY - rotY) * 0.06;
  rotX += (targetRotX - rotX) * 0.06;

  pivot.rotation.y = rotY + autoRotY;
  pivot.rotation.x = rotX;

  /* gentle node pulse */
  meshes.forEach(function(m){
    var sc = 1 + Math.sin(t*2.0 + m.node.pos[0])*0.04;
    m.mesh.scale.setScalar(sc);
  });

  /* hover detection */
  if(!isDragging){
    raycaster.setFromCamera(mouse, camera);
    var hits = raycaster.intersectObjects(meshes.map(function(m){return m.mesh;}));
    var newHovered = hits.length ? hits[0].object.userData.nodeId : null;
    if(newHovered !== hovered){
      hovered = newHovered;
      canvas.style.cursor = (hovered && CONTENT[hovered]) ? 'pointer' : (hovered ? 'pointer' : '');
    }
  }

  pivot.updateMatrixWorld();
  updateLabels();
  renderer.render(scene, camera);
}
animate();

/* ═══════════════════════════════════════
   RESIZE
════════════════════════════════════════ */
window.addEventListener('resize', function(){
  W=window.innerWidth; H=window.innerHeight;
  isMobile=W<700;
  camera.aspect=W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H);
  camera.position.z = isMobile ? 7.5 : 6.2;
});

})();
</script>
</body>
</html>
